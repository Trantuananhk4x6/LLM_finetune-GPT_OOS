model:
  base_model_id: Qwen/Qwen2.5-7B-Instruct
  cache_dir: ./cache/huggingface
  trust_remote_code: true
  use_flash_attention: false
  quantization:
    load_in_4bit: true
    quant_type: nf4
    compute_dtype: bfloat16
    double_quant: true
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
training:
  output_dir: ./artifacts/runs/qwen-smart-sales
  train_file: ./data/processed/smart_sales_train.jsonl
  validation_file: ./data/processed/smart_sales_val.jsonl
  max_seq_length: 1536
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  num_train_epochs: 3
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 2
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true
  report_to: []
  resume_from_checkpoint: null
