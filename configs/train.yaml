model:
  base_model_id: Qwen/Qwen3.5-9B
  cache_dir: ./cache/huggingface
  trust_remote_code: true
  use_flash_attention: false
  quantization:
    load_in_4bit: true
    quant_type: nf4
    compute_dtype: bfloat16
    double_quant: true
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
      - in_proj_qkv
      - in_proj_z
      - in_proj_b
      - in_proj_a
      - out_proj
training:
  output_dir: ./artifacts/runs/qwen35-sales-qlora
  train_file: ./data/processed/sales_train.jsonl
  validation_file: ./data/processed/sales_validation.jsonl
  max_seq_length: 2048
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  num_train_epochs: 1
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 1000
  eval_steps: 1000
  save_total_limit: 3
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true
  report_to: []
  resume_from_checkpoint: null
